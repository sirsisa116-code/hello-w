# ===== スコアの重みと点数ルール =====
# ここの数字を書き換えると、ランキングの付け方が変わります。
# 書き換えたら version を1つ上げてください。history.csv に記録され、
# 後の検証で「どのルールで付けたランキングか」を区別できます。
#
# 注意: 下の点数は一般的な使われ方を参考にした仮の値で、効果は検証していません。
#       段階3の事後検証で当たり外れを見ながら調整していく前提です。

version: 2   # 2: 適時開示を追加

# --- 分野ごとの重み ---
# 総合点 = 各分野の点数（0〜100、50が中立）を重みで平均したもの。
# 重み0の分野は使わない。データが取れなかった分野は除いて、残りの重みで計算し直す。
category_weights:
  technical: 1.0
  disclosure: 1.0    # 適時開示（タイトルによる機械的な分類）
  fundamental: 0     # 段階4で設定する
  news: 0            # ニュースの Claude 判定（後で設定する）

# --- ランキングに入れる条件 ---
filters:
  min_turnover_oku: 3       # 20日平均の売買代金（億円）がこれ未満の銘柄は外す（売買しにくいため）

# --- テクニカルの点数ルール ---
# 分野の点数 = 50 + 各指標の点数の合計（0〜100の範囲に収める）
# 各指標は上から順に条件を見て、最初に当てはまった行の点数を使う。
#   min: この値以上   max: この値未満   （書いていなければ制限なし）
technical:
  # 計算できた指標がこの割合未満なら、テクニカル分野を「欠損」とする
  min_available_ratio: 0.5
  rules:
    ma_alignment:          # 5日線 > 25日線 > 75日線 なら +1（上昇配列）
      - {min: 1, points: 10, note: 上昇配列（5日>25日>75日）}
      - {max: 0, points: -10, note: 下降配列（5日<25日<75日）}
      - {points: 0, note: 移動平均の並びはまちまち}

    ma25_slope:            # 25日線が5営業日でどれだけ上がったか（%）
      - {min: 0.5, points: 6, note: 25日線がはっきり上向き}
      - {min: 0, points: 2, note: 25日線がやや上向き}
      - {min: -0.5, points: -2, note: 25日線がやや下向き}
      - {points: -6, note: 25日線がはっきり下向き}

    deviation25:           # 株価が25日線から何%離れているか
      - {min: 15, points: -10, note: 25日線から上に離れすぎ（過熱）}
      - {min: 8, points: -3, note: 25日線からやや上に離れている}
      - {min: 0, points: 5, note: 25日線の上で過熱していない}
      - {min: -5, points: 2, note: 25日線のやや下（押し目の可能性）}
      - {points: -5, note: 25日線を大きく下回る}

    rsi14:
      - {max: 30, points: 3, note: 売られすぎ（反発狙い。ただし下落中の可能性も）}
      - {max: 45, points: 6, note: やや売られた水準（押し目圏）}
      - {max: 65, points: 4, note: 中立〜やや強い}
      - {max: 75, points: 0, note: 強い}
      - {points: -8, note: 買われすぎ}

    volume_ratio_signed:   # 直前20日平均に対する出来高の倍率。下落した日はマイナスの値になる
      - {min: 2, points: 8, note: 出来高急増を伴う上昇}
      - {min: 1.3, points: 4, note: 出来高増加を伴う上昇}
      - {min: -1.3, points: 0, note: 出来高は平常}
      - {min: -2, points: -4, note: 出来高増加を伴う下落}
      - {points: -8, note: 出来高急増を伴う下落}

    high52_distance:       # 52週高値から何%下にいるか（0に近いほど高値圏）
      - {min: -3, points: 8, note: 52週高値の近く（高値更新が近い）}
      - {min: -10, points: 4, note: 52週高値まで10%以内}
      - {min: -30, points: 0, note: 52週高値から10〜30%下}
      - {points: -4, note: 52週高値から30%以上下}

# --- 適時開示の点数ルール ---
# 分野の点数 = 50 + Σ（下の points × 日がたつほど小さくなる重み）を 0〜100 に収める。
# 重みは開示当日が1で、decay_days 日（カレンダー日）で0になる。
# タイトルに include のどれかを含み、exclude のどれも含まないと当てはまる（ただの文字列で、正規表現ではない）。
# 1件の開示が複数の決まりに当てはまることもある（例: 上方修正と増配）。
# points: 0 の決まりは点数には効かず、レポートに「こういう開示があった」と表示するためのもの。
disclosure:
  decay_days: 14
  ignore: [訂正]       # これを含むタイトルは無視する（過去の開示の訂正なので）
  rules:
    - {category: upward_revision, label: 上方修正, points: 8, include: [上方修正]}
    - {category: downward_revision, label: 下方修正, points: -8, include: [下方修正]}
    - {category: revision_unknown, label: 業績予想の修正（方向は本文を見ないと不明）, points: 0,
       include: [業績予想の修正, 業績予想修正], exclude: [上方, 下方]}
    - {category: dividend_up, label: 増配・復配, points: 4, include: [増配, 復配, 記念配当, 特別配当]}
    - {category: dividend_down, label: 減配・無配, points: -6, include: [減配, 無配], exclude: [復配]}
    - {category: buyback, label: 自社株買い, points: 5,
       include: [自己株式の取得, 自己株式取得, 自社株買い, 自己株式の公開買付け], exclude: [状況, 結果, 終了, 完了]}
    - {category: split, label: 株式分割, points: 2, include: [株式分割], exclude: [株式分割に伴う]}
    - {category: dilution, label: 増資・株式の売出し, points: -6,
       include: [新株式発行, 公募, 第三者割当, 株式の売出し, 新株予約権の発行],
       exclude: [ストック・オプション, ストックオプション, 譲渡制限付株式, 株式報酬]}
    - {category: misconduct, label: 不祥事・調査, points: -8,
       include: [不適切, 不正, 第三者委員会, 特別調査委員会, 行政処分, 業務改善命令, 課徴金]}
    - {category: impairment, label: 特別損失・減損, points: -3, include: [特別損失, 減損損失]}
    - {category: earnings, label: 決算発表（中身はまだ評価していない）, points: 0, include: [決算短信]}
