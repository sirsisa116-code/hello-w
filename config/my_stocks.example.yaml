# ===== 自分の保有・注目銘柄の一覧（見本）=====
# このファイルをコピーして config/local/my_stocks.yaml という名前で保存し、自分の銘柄を書いてください。
# config/local/ は GitHub に上がらないので、保有銘柄が外に出ることはありません。
#
# 書き方: "銘柄コード": メモ（メモは空でもかまいません）
# 銘柄コードは必ず " " で囲んでください（7203 のような数字だけのコードを、数として読ませないため）。
# TOPIX500 に入っていない銘柄も書けます（株価と開示を別に取ります）。

"7203": 保有中 100株
"6758": 注目
